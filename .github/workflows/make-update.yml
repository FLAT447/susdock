name: Make Update
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Manual tag (e.g., v0.3.0-300)"
        required: true

jobs:
  build-update:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            git fetch --tags --force
            tag="$(git tag --points-at HEAD | grep '^v' | head -n 1 || true)"
            if [ -z "$tag" ]; then
              echo "::error::No release tag found on the workflow_run HEAD commit (${GITHUB_SHA})"
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: make update files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OUT_DIR: update-out
        run: |
          VERSION="${TAG#v}"; VERSION="${VERSION%-*}"
          VERSION_CODE="${TAG##*-}"
          export VERSION VERSION_CODE
          node scripts/make-update.ts

      - name: publish update branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: update
          build_dir: update-out
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
