# Docs: https://github.com/mishamyrt/commitfmt#configuration

[lint.header]
type-enum = [
  "feat",
  "fix",
  "docs",
  "refactor",
  "perf",
  "test",
  "build",
  "ci",
  "chore",
  "revert",
]
scope-enum = [
  "module",
  "webui",
  "ci",
  "deps",
  "docs",
  "tooling"
]
description-case = "lower-first"
description-max-length = 72
description-full-stop = true
type-required = true

[lint.body]
max-line-length = 72
case = "upper-first"

[lint.footer]
breaking-exclamation = true
